name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - CMakeLists.txt
      - identity.env
      - src/**
      - resources/**
      - tools/**
      - docs/Docker.md
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - CMakeLists.txt
      - identity.env
      - src/**
      - resources/**
      - tools/**
      - docs/Docker.md
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux image
        run: docker build --build-arg DLNA_VERSION=0.0.00000 -t dlna-server:ci .
      - name: Start the server and check description.xml
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/media"
          docker volume create dlna-ci-config
          cleanup() {
            docker rm -f dlna-ci >/dev/null 2>&1 || true
            docker volume rm dlna-ci-config >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name dlna-ci \
            --network host \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --security-opt no-new-privileges:true \
            -e XDG_CONFIG_HOME=/config \
            -v dlna-ci-config:/config \
            -v "${RUNNER_TEMP}/media:/media:ro" \
            dlna-server:ci --source /media
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/description.xml >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs dlna-ci
          test "${ready}" = "1"
          docker stop -t 20 dlna-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' dlna-ci)" = "0"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DLNA_VERSION=0.0.00000
          cache-from: type=gha
          cache-to: type=gha,mode=max
