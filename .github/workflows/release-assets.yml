name: Release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Linux release assets
        run: sudo bash build.sh
      - name: Publish release with Linux assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build.sh --release --notes

  windows:
    needs: [linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows release assets
        shell: cmd
        run: build.bat --x86 --x64
      - name: Upload Windows assets to release
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: build.bat --release --update %GITHUB_REF_NAME%
