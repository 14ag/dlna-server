[pytest]
addopts = -p no:cacheprovider --basetemp=tmp --ignore=build-winx64 --ignore=build-winx64-test --ignore=build-release-linux-stage --ignore=build-release-linux
markers =
    posix_only: test that runs only on POSIX platforms (Linux/macOS)
    windows_only: test that runs only on Windows platforms
    gui_only: test that requires the native GTK4 GUI binary and an interactive display; deselected on all platforms
