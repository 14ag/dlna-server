[pytest]
addopts = -p no:cacheprovider -p no:xvfb --basetemp=tmp --ignore=build-winx64 --ignore=build-winx64-test --ignore=build-release-linux-stage --ignore=build-release-linux
markers =
    posix_only: test that runs only on POSIX platforms (Linux/macOS)
    windows_only: test that runs only on Windows platforms
    gui_only: test that requires the native GTK4 GUI binary and an interactive display; deselected on all platforms
    needs_xvfb: test that launches the GTK4 GUI and requires a virtual X display (Xvfb); spawns its own Xvfb, run with `-p no:xvfb` disabled plugin
