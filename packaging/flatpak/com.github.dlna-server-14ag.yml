app-id: com.github.dlna-server-14ag
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: dlna-server-gui
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
modules:
  - name: dlna-server
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DDLNA_ENABLE_GTK4_GUI=ON
      - -DDLNA_FLATPAK_BUILD=ON
    sources:
      - type: dir
        path: ../..
    post-install:
      - install -Dm644 packaging/flatpak/com.github.dlna-server-14ag.desktop /app/share/applications/com.github.dlna-server-14ag.desktop
      - install -Dm644 resources/dlna-server.svg /app/share/icons/hicolor/scalable/apps/com.github.dlna-server-14ag.svg
      - rm -f /app/share/applications/dlna-server.desktop /app/share/metainfo/dlna-server.appdata.xml /app/share/icons/hicolor/scalable/apps/dlna-server.svg
