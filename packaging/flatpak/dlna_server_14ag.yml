app-id: com.github.dlna_server_14ag
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: dlna-server-gui
build-args:
  - --share=network
  - --filesystem=host
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
modules:
  - name: dlna-server
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DDLNA_ENABLE_GTK4_GUI=ON
      - -DDLNA_FLATPAK_BUILD=ON
      - -DDLNA_VERSION=@PROJECT_VERSION@
    sources:
      - type: dir
        path: ../..
    post-install:
      - install -Dm644 packaging/flatpak/dlna_server_14ag.desktop /app/share/applications/com.github.dlna_server_14ag.desktop
